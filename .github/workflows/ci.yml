name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"  # the version requirements-lock.txt and the committed results were made with
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Test
        run: pytest
      - name: Committed results come from the current code, and the paper's numbers from them
        if: hashFiles('results/episodes.csv.gz') != ''
        run: |
          python -m speclens.experiment --config configs/paper.yaml --out results --verify
          python -m speclens.report --config configs/paper.yaml --results results --paper paper
          git status --porcelain -- paper/generated results/numbers.json results/summary_*.csv results/monitor_*.csv
          test -z "$(git status --porcelain -- paper/generated results/numbers.json results/summary_*.csv results/monitor_*.csv)"
