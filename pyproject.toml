[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speclens-rl"
version = "1.0.0"
description = "Small, auditable model organisms of reward hacking, reward tampering and monitorability in RL."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Raj Kashikar" }]
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=1.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/raj200501/SpecLens-RL"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "B905",  # zip() without strict=: every zip in this codebase pairs equal-length sequences by construction
  "RUF001", "RUF002", "RUF003",  # unicode glyphs in figure labels are intentional
]
